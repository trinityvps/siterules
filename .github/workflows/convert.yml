name: Convert Rules

on:
  push:
    paths:
      - "source/rules.list"
      - "scripts/convert.py"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Convert rules
        run: |
          python scripts/convert.py

      - name: Commit generated rules
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated/

          if git diff --cached --quiet; then
            echo "No generated rule changes."
          else
            git commit -m "Auto update generated rules"
            git push
          fi
